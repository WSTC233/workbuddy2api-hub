[pytest]
# These suites are named `_test_*.py` (matching tests/run_all.py discovery),
# but pytest only picks up test_*.py / *_test.py by default -- so
# `pytest tests` used to collect 0 tests and exit 1 with "no tests collected",
# which reads like the whole suite is broken.
# Accept both spellings here; run_all.py needs no change.
#
# ASCII-only on purpose: pytest reads this file with the locale encoding
# (GBK on a zh-CN Windows), so non-ASCII bytes raise UnicodeDecodeError
# before any test is collected.
python_files = _test_*.py test_*.py *_test.py
testpaths = tests
